[loggers]
keys=root, MainProcess, node_runner

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_MainProcess]
level=INFO
handlers=consoleHandler
qualname=bpmn4j.test_2_scripts.MainProcess
propagate=0

[logger_node_runner]
level=CRITICAL
handlers=
qualname=google_adk.google.adk.workflow._node_runner
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s